[global]
error_log = /proc/self/fd/2
log_limit = 8192
daemonize = no

[www]
user = www-data
group = www-data
; unix socket only - the container listens on exactly ONE network port (nginx)
listen = /run/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = dynamic
; rewritten at start from the memory limit and the database connection limit
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
request_terminate_timeout = 120s
request_slowlog_timeout = 5s
slowlog = /proc/self/fd/2
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
