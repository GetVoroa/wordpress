server {
  listen 3000;
  root /var/www/html;
  index index.php;

  add_header X-Robots-Tag $voroa_robots always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # ---- page cache: skip for anything personal or dynamic --------------------------------------
  set $skip_cache 0;
  if ($request_method = POST) { set $skip_cache 1; }
  if ($query_string != "") { set $skip_cache 1; }
  if ($request_uri ~* "/wp-admin/|/wp-login\.php|/xmlrpc\.php|/wp-json/|/cart|/checkout|/my-account|/wc-api/|/feed|sitemap(_index)?\.xml|/wp-cron\.php") { set $skip_cache 1; }
  if ($http_cookie ~* "wordpress_logged_in|wp-postpass|comment_author|woocommerce_items_in_cart|woocommerce_cart_hash|wp_woocommerce_session") { set $skip_cache 1; }

  location = /favicon.ico { log_not_found off; access_log off; }
  location = /robots.txt { try_files $uri /index.php?$args; access_log off; }

  location = /xmlrpc.php { deny all; }
  # The site is installed on first start from its settings; the web installer is never reachable, so nobody can
  # claim a new site before its owner.
  location = /wp-admin/install.php { return 404; }
  location = /wp-admin/setup-config.php { return 404; }
  location ~ /\.(?!well-known) { deny all; }
  location ~* ^/wp-content/uploads/.*\.(php|phtml|phar)$ { deny all; }
  location ~* ^/wp-config\.php$ { deny all; }

  location = /wp-login.php {
    limit_req zone=wplogin burst=5 nodelay;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param HTTPS $fwd_https;
    fastcgi_pass unix:/run/php-fpm.sock;
  }

  location ~* \.(css|js|jpg|jpeg|png|gif|webp|avif|svg|ico|woff2?|ttf|eot|mp4|webm)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
    access_log off;
  }

  location / {
    try_files $uri $uri/ /index.php?$args;
  }

  location ~ \.php$ {
    try_files $uri =404;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param HTTPS $fwd_https;
    fastcgi_pass unix:/run/php-fpm.sock;
    fastcgi_read_timeout 120s;

    fastcgi_cache WP;
    fastcgi_cache_valid 200 8h;
    fastcgi_cache_use_stale error timeout updating;
    fastcgi_cache_lock on;
    fastcgi_cache_bypass $skip_cache;
    fastcgi_no_cache $skip_cache;
    add_header X-Cache $upstream_cache_status always;
    add_header X-Robots-Tag $voroa_robots always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
  }
}
