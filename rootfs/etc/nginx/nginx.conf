user www-data;
worker_processes 2;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;
  client_max_body_size 64m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/rss+xml image/svg+xml;

  # Real visitor IP: right-most address that is not a trusted proxy (list written at start).
  include /etc/nginx/voroa-realip.conf;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # HTTPS as seen by the visitor (TLS ends at the platform edge).
  map $http_x_forwarded_proto $fwd_https { default ""; https on; }

  # The platform's own hostname is never indexed - only the customer's domain is.
  map $host $voroa_robots { default ""; ~\.onvoroa\.com$ "noindex, nofollow"; ~\.getvoroa\.com$ "noindex, nofollow"; }

  limit_req_zone $binary_remote_addr zone=wplogin:10m rate=10r/m;

  fastcgi_cache_path /var/cache/nginx/wp levels=1:2 keys_zone=WP:32m max_size=256m inactive=8h use_temp_path=off;
  fastcgi_cache_key "$http_x_forwarded_proto$request_method$host$request_uri";

  include /etc/nginx/conf.d/*.conf;
}
